[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous reasoning, code generation, and execution agent"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "mcp==1.29.1",
]

[project.scripts]
sandbox = "src.sandbox_cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
